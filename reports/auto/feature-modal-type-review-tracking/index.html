*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size:14px;
  line-height:1.55;
  padding-inline:16px;
}
.mono{font-family:"IBM Plex Mono","SF Mono",Consolas,monospace;}
a{color:var(--accent-strong);text-decoration:none;}
a:hover{text-decoration:underline;}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 60px;}

/* header */
header.page{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;}
header.page h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance;}
.meta-line{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--text-muted);font-size:12.5px;}
.meta-line b{color:var(--text);font-weight:600;}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
@media (max-width:760px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:13px 14px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:4px;
}
.kpi .num{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
.kpi .lbl{font-size:11.5px;color:var(--text-muted);}
.kpi.accent{border-color:var(--accent);}
.kpi.accent .num{color:var(--accent-strong);}
.kpi.warn .num{color:var(--sev-blocking);}

/* severity bars per row inside kpi extra */
.state-bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin-top:2px;}
.state-bar span{display:block;height:100%;}

/* section titles */
h2.sec{font-size:14px;font-weight:700;margin:30px 0 10px;display:flex;align-items:center;gap:8px;}
h2.sec .count{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--text-muted);font-size:12px;}

/* filter bar */
.filters{
  display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:14px;
}
.filter-group{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.filter-group .fg-label{font-size:11px;color:var(--text-faint);margin-right:2px;text-transform:uppercase;letter-spacing:.04em;}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);
  border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none;
  transition:background .12s,color .12s,border-color .12s;
}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip.active.sev-blocking{background:var(--sev-blocking);border-color:var(--sev-blocking);}
.chip.active.sev-major{background:var(--sev-major);border-color:var(--sev-major);}
.chip.active.sev-minor{background:var(--sev-minor);border-color:var(--sev-minor);color:#2a2205;}
.chip.active.sev-test{background:var(--sev-test);border-color:var(--sev-test);}
.chip.active.sev-nit{background:var(--sev-nit);border-color:var(--sev-nit);}
select.repo-select{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:8px;padding:4px 8px;font-size:12px;font-family:inherit;
}
.reset-link{font-size:12px;color:var(--text-faint);cursor:pointer;margin-left:auto;}
.reset-link:hover{color:var(--accent-strong);}

/* finding rows */
.list{display:flex;flex-direction:column;gap:7px;}
.row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.row-head{
  display:grid;
  grid-template-columns:15px 74px 56px 1fr auto auto auto;
  align-items:center;gap:12px;padding:10px 12px;cursor:pointer;
}
@media (max-width:760px){
  .row-head{grid-template-columns:10px 1fr;grid-template-areas:"stripe id" "stripe title" "stripe meta";row-gap:4px;}
  .row-head .id, .row-head .title, .row-head .meta-cell{grid-column:2;}
}
.stripe{width:4px;align-self:stretch;border-radius:3px;background:var(--sev-nit);}
.stripe.sev-blocking{background:var(--sev-blocking);}
.stripe.sev-major{background:var(--sev-major);}
.stripe.sev-minor{background:var(--sev-minor);}
.stripe.sev-test{background:var(--sev-test);}
.stripe.sev-nit{background:var(--sev-nit);}
.id{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--text-muted);}
.sev-badge{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;text-align:center;justify-self:start;
}
.sev-badge.sev-blocking{background:var(--sev-blocking-bg);color:var(--sev-blocking);}
.sev-badge.sev-major{background:var(--sev-major-bg);color:var(--sev-major);}
.sev-badge.sev-minor{background:var(--sev-minor-bg);color:var(--sev-minor);}
.sev-badge.sev-test{background:var(--sev-test-bg);color:var(--sev-test);}
.sev-badge.sev-nit{background:var(--sev-nit-bg);color:var(--sev-nit);}
.title{font-weight:600;font-size:13.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.title .loc{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.3px;color:var(--text-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.title .loc .anchor-note{color:var(--accent);cursor:help;}
.meta-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pr-link{font-family:"IBM Plex Mono",monospace;font-size:11.5px;white-space:nowrap;}
.batch-tag{font-size:10.5px;color:var(--text-faint);border:1px solid var(--border);border-radius:999px;padding:1px 7px;white-space:nowrap;}
.state-pill{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.state-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.state-open{color:var(--state-open);background:color-mix(in srgb, var(--state-open) 14%, transparent);}
.state-replied{color:var(--state-replied);background:color-mix(in srgb, var(--state-replied) 14%, transparent);}
.state-resolved{color:var(--state-resolved);background:color-mix(in srgb, var(--state-resolved) 14%, transparent);}
.state-unknown{color:var(--state-unknown);background:color-mix(in srgb, var(--state-unknown) 14%, transparent);}
.days{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-faint);white-space:nowrap;}
.corr-flag{font-size:10.5px;color:var(--sev-major);border:1px solid var(--sev-major);border-radius:999px;padding:1px 6px;white-space:nowrap;}
.chevron{color:var(--text-faint);font-size:11px;transition:transform .15s;justify-self:end;}
.row.open .chevron{transform:rotate(90deg);}

.row-body{display:none;border-top:1px solid var(--border);padding:14px 16px 16px 30px;background:var(--surface-2);}
.row.open .row-body{display:block;}
.row-body .block{margin-bottom:12px;}
.row-body .block:last-child{margin-bottom:0;}
.row-body .block h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;}
.row-body .block p{margin:0;font-size:13px;color:var(--text);white-space:pre-wrap;}
.also-affects{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;}
.also-affects li{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-muted);}
.also-affects li .note{font-family:"IBM Plex Sans",sans-serif;color:var(--text-faint);}
.correction-box{
  border:1px solid var(--sev-major);background:var(--sev-major-bg);color:var(--sev-major);
  border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px;
}
.row-actions{display:flex;gap:10px;margin-top:12px;align-items:center;}
.copy-btn{
  font-size:11.5px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  border-radius:6px;padding:4px 9px;cursor:pointer;font-family:inherit;
}
.copy-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
.owner-line{font-size:12px;color:var(--text-muted);}

.empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px;}

/* PR group section */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.pr-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;
}
.pr-card .pr-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.pr-card .pr-name{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;}
.pr-card .pr-batch{font-size:10.5px;color:var(--text-faint);}
.pr-card .pr-counts{font-size:11.5px;color:var(--text-muted);display:flex;justify-content:space-between;}
.pr-card .pr-counts b{font-family:"IBM Plex Mono",monospace;color:var(--text);}

footer.page{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-faint);font-size:11.5px;display:flex;flex-direction:column;gap:4px;}

@media (max-width:480px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  h1{font-size:19px;}
}
</style>

mental、# CHIR plugin、# CHIR opt、# debug info。诊断文案类：# err message mismatch @local! in type diag（arraysizedlit1/2.cj）、# strange error message in sema。另有 5 条标注 # breaking changes caused by adding API，2 条作者自注「this is not caused by local mode」。这份清单是本次合入最完整、最可靠的已知缺陷记录——它由实际跑挂的用例得来，比任何静态检视都直接。", "failure_scenario": "这些不是「暂时跳过的不稳定用例」，而是已知会崩溃或已知未适配的真实功能路径被从门禁里摘除。以 # runtime Barrier WriteGeneric SIGABRT 为例：用户代码只要触发同一条泛型写屏障路径，运行时就会 SIGABRT，而门禁因为这三条用例被排除而显示通过。CJMP（objc 互操作）整个目录被禁用意味着该子系统在 modal 特性下的行为完全无人验证。排除项不会自己提醒人回来处理，随着分支继续演进，这 35 条会逐渐沉淀为永久缺口。", "suggestion": "在 feature/modal-type 合入主干之前，逐条给出处置结论并记录在案：(1) 10 条运行时崩溃类必须修复而非排除——尤其 Barrier WriteGeneric SIGABRT 三条，它们对应 L1-05 的写屏障缺口；(2) CJMP 整目录禁用需要明确的适配计划与时间点，否则等于该子系统不支持 modal 特性；(3) 每条排除项补上关联 issue 号，使其可被跟踪；(4) 建议给排除清单加一个「本次特性新增」的分节标记，避免与历史排除项混在一起、日后无法区分。", "confidence": "high", "also_affects": [{"repo": "cangjie_test", "file": "testsuites/LLT/cjnative_testlist_win"}, {"repo": "cangjie_test", "file": "testsuites/LLT/cjnative_testlist_darwin_aarch64"}], "posted_file": "testsuites/LLT/cjnative_testlist", "posted_line": 152, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:15+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "f0018827251eba357e5a2decef279904f6b0d43c", "has_correction": true, "correction_note": "更正 L3-01 的三处：CJMP 范围 / 四处 FATAL 位置 / 分类计数"}, {"id": "L1-01", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "major", "category": "contract", "repo": "cangjie_compiler", "pr": 2065, "file": "schema/NodeFormat.fbs", "line": 59, "title": "NodeFormat.fbs 两个 union 中插新成员，导致其后全部成员的 tag 编号整体偏移", "detail": "flatbuffers 的 union 成员按声明顺序隐式编号（NONE=0，首个成员=1），这两个 union 都没有显式编号。本次把 EXCLAVE_EXPR 插在 SYNCHRONIZED_EXPR 与 LET_PATTERN_DESTRUCTOR 之间，使 LET_PATTERN_DESTRUCTOR 及其后 11 个成员（TOKEN_PART / QUOTE_EXPR / MATCH_EXPR / OPTIONAL_EXPR / OPTIONAL_CHAIN_EXPR / MACRO_EXPAND_EXPR / WILDCARD_EXPR / ARRAY_EXPR / PERFORM_EXPR / RESUME_EXPR）的 tag 全部 +1；union AnyDecl 把 THIS_PARAM 插在 FUNC_PARAM 之后，使 MACRO_EXPAND_PARAM 的 tag +1。这与仓内 ModuleFormat.fbs:552 自己写下的约定「For compatibility any new type kind MUST only be added at last」相悖，而本次 cjo 侧的 ModuleFormat/PackageFormat 全部遵守了该约定，唯独 NodeFormat 没有。NodeFormat 是编译器与宏包之间传递 AST 的格式，写侧是 compiler 的 src/Macro/NodeSerialization.cpp，读侧是 runtime 仓的 std.ast（parse_expr.cj 等）。", "failure_scenario": "写侧与读侧版本不一致时（典型场景：二进制分发的第三方宏包由旧 SDK 编译、其内嵌的 std.ast 解码逻辑停留在旧 tag 表，而用户用新 SDK 的编译器展开该宏）：新编译器写出的 ExclaveExpr（tag 31）会被旧 std.ast 解成 LET_PATTERN_DESTRUCTOR；新写出的 LetPatternDestructor（tag 32）被解成 TOKEN_PART，其后每一种表达式依次错位。由于 tag 合法、表结构可读，不会抛异常，表现为宏展开得到一棵语义完全错误的 AST——静默错误，不是崩溃。反方向（新 std.ast 读旧 buffer）则 GetExprAsExclaveExpr() 拿到的是 LetPatternDestructor 的内存布局，走到 parse_expr.cj:662 的 throw ParseASTException()，表现为无来由的宏解析失败。", "suggestion": "把 EXCLAVE_EXPR 移到 union AnyExpr 末尾、THIS_PARAM 移到 union AnyDecl 末尾；或给两个 union 的全部成员补上显式编号并让新成员取最大值+1，以后即使中插也不会改动既有 tag。若判定「编译器与 std.ast 永远同版本发布、二进制宏包不跨版本」是可依赖的前提，则至少把该前提写进 NodeFormat.fbs 的注释，并说明为何此处可以不遵守 ModuleFormat.fbs:552 的约定。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "schema/NodeFormat.fbs", "note": "union AnyDecl 同样问题：THIS_PARAM 插在 FUNC_PARAM 与 MACRO_EXPAND_PARAM 之间"}, {"repo": "cangjie_runtime", "file": "stdlib/schema/NodeFormat.fbs", "note": "同一文件的副本，同样改动"}, {"repo": "cangjie_runtime", "file": "stdlib/libs/std/ast/parse_expr.cj", "note": "读侧 std.ast"}], "posted_file": "schema/NodeFormat.fbs", "posted_line": 59, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:20+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "30fa992b9547f348446db0a227863bbea1a6df47", "has_correction": false, "correction_note": null}, {"id": "L1-02", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "major", "category": "contract", "repo": "cangjie_compiler", "pr": 2065, "file": "include/cangjie/Modules/CjoManager.h", "line": 24, "title": "cjo schema 新增 10+ 字段与 2 个新 DeclKind/ExprKind，但 cjo 根本没有读侧版本校验，版本号也未 bump", "detail": "本次在 ModuleFormat.fbs / PackageFormat.fbs 新增了 thisParam、retTyMode、demode、isExclave、tyMode、matchedParentTyMode、tyModes、typeArgsMode、body、modal 等字段，以及 DeclKind::ThisParam、ExprKind::ExclaveExpr、BuiltInType::Copy、CHIRExprKind::{Exclave,StartRegion,EndRegion}。核实后发现比「未 bump 版本号」更根本的问题：全仓搜索 CJO_MAJOR_VERSION / CJO_MINOR_VERSION / CJO_PATCH_VERSION / cjoVersion 的所有引用，只找到定义处（CjoManager.h:24-26，值 0.1.0）与写侧（ASTWriter.cpp:806-807 把它写进 Package），**没有任何读侧代码比较过这个字段**。也就是说 cjo 里虽然带着版本号，却不存在版本校验这道工序，新旧 cjo 一律被同等接受。这一状况在 merge_base 就已如此，不是本次改动引入的回归；但本次大幅扩展 schema 使其后果第一次具有实际意义。新编译器读旧 cjo 方向是安全的（缺字段回落 Mode::NOT，等价旧语义，已核实）；有问题的是反方向。", "failure_scenario": "用户用新 SDK 编译出一个带 @local! 声明的库，另一名同事用旧 SDK 的编译器导入该 cjo：没有任何版本比对会拦下它，flatbuffers 静默忽略不认识的字段，于是 @local! 函数被读成普通非 local 函数——本该被拒绝的调用被放行，且没有任何诊断。若该 cjo 里含新增的 DeclKind::ThisParam，旧编译器的 DeclKind 分派没有对应分支，行为取决于其 default 分支，最好情况是报一个与真实原因无关的错误。", "suggestion": "单独 bump CJO_MINOR_VERSION 不会产生任何效果——必须先补上读侧校验。建议：在 ASTLoader 载入 Package 后比较 cjoVersion 与本编译器的 CJO_*_VERSION，不兼容时给出明确的「cjo 版本过新/过旧」诊断；然后再把本次 schema 扩展作为一次 minor bump。若项目 policy 是「不支持旧编译器读新 cjo、由构建系统保证同版本」，则应确认该 policy 有文档依据，并把本项标注为已知接受风险。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "schema/ModuleFormat.fbs"}, {"repo": "cangjie_compiler", "file": "schema/PackageFormat.fbs"}], "posted_file": "schema/ModuleFormat.fbs", "posted_line": 34, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:22+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "445242148fe767f0ab591c7fb43512c19c68901e", "has_correction": false, "correction_note": null}, {"id": "L1-07", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "major", "category": "compat", "repo": "cangjie_compiler", "pr": 2065, "file": "src/Lex/Lexer.cpp", "line": 313, "title": "exclave / demode 被提升为无条件保留字，未接入本仓现成的特性门控，破坏存量代码源码兼容性", "detail": "Tokens.inc:179-180 新增 TOKEN(EXCLAVE, \"exclave\", ...) 与 TOKEN(DEMODE, \"demode\", ...)，并在 Lexer.cpp:313-314 无条件注册进 LookupKeyword 的 tokenMap。对比之下，同一特性里的 local 关键字做了保护：ParseType.cpp:21 定义 constexpr std::string_view LOCAL_MODE_SPECIFIER(\"local\")，解析时以 Seeing(TokenKind::IDENTIFIER) && Peek().Value() == LOCAL_MODE_SPECIFIER 的上下文方式匹配，因此 local 仍可作标识符。关键在于：LookupKeyword 函数末尾就有一段现成的特性门控降级——if (!ehEnabled && (kind == PERFORM || RESUME || THROWING || HANDLE)) return TokenKind::IDENTIFIER;——上一个引入新关键字的特性（effect handlers）正是用它解决了同一个问题。新增的 EXCLAVE/DEMODE 写在这段门控正上方两行却没有接入，且全仓搜不到 localModeEnabled/modalEnabled 一类开关，说明 local mode 特性没有对应的门控变量。Token 编号本身无问题：Tokens.inc 两项为末尾追加（索引 161/162，共 163 项），既有 token 编号未偏移；std.ast 的 getTokenID 也是末尾追加 165/166，无冲突。", "failure_scenario": "任何存量仓颉工程只要把 exclave 或 demode 用作标识符（变量名、函数名、参数名、字段名），升级到含本次合入的编译器后**直接编译失败**，报语法错误而非清晰的「该标识符已成为保留字」提示。用户无从判断这是特性引入的破坏，也没有开关可关。对比 effect handlers 特性：同样新增 4 个关键字，但未开启特性时自动降级为标识符，存量代码零影响。", "suggestion": "照抄同函数内 ehEnabled 的写法：引入 localModeEnabled（或复用已有的特性开关机制），在 LookupKeyword 末尾把 EXCLAVE/DEMODE 一并纳入降级分支——特性未开启时返回 TokenKind::IDENTIFIER。改动量极小（一个成员变量 + 扩展现有 if 条件），但覆盖全部存量代码。若项目已决定 local mode 为默认开启、且接受这两个词的保留字化，则应在 release note 中显式列为 breaking change，并提供一条明确诊断而非裸语法错误。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "include/cangjie/Lex/Tokens.inc", "line": 179, "note": "TOKEN(EXCLAVE)/TOKEN(DEMODE) 定义处"}, {"repo": "cangjie_runtime", "file": "stdlib/libs/std/ast/token_kind.cj", "line": 181, "note": "std.ast 侧同步暴露 TokenKind.EXCLAVE/DEMODE"}], "posted_file": "src/Lex/Lexer.cpp", "posted_line": 313, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:25+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "22c2fe1d10b540307d22ee54310b241940d16ba1", "has_correction": false, "correction_note": null}, {"id": "L1-08", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "major", "category": "memory-safety", "repo": "cangjie_compiler", "pr": 2065, "file": "src/CHIR/Transformation/SetMemRegion.cpp", "line": 126, "title": "local region 启动失败的返回值被丢弃：CHIR 层把 StartRegion 结果建成 Unit，没有任何分支检查", "detail": "runtime 侧 MCC_StartLocalRegion / MCC_StartLocalRegionWithFrame 返回 bool，失败路径真实存在：NativeLocalObjectAllocator::AllocateRegion（LocalObjectAllocator.cpp:1014）在 NativeAllocator::NativeAlloc 返回 nullptr、或后续 new LocalNativeRegion 失败时返回 nullptr，逐级上报为 StartRegion 返回 false。codegen 侧 HandleStartRegion（OtherExprDispatcher.cpp:397）确实按 i1 取回了这个返回值。但 CHIR 层生成该表达式的地方——SetMemRegion.cpp:126 的 builder.CreateExpression<StartRegion>(builder.GetUnitTy(), entryBlock)——把结果类型建成了 **Unit**，即这个 bool 在 CHIR 语义上就是 Unit，不存在任何消费者对其分支。失败信息在编译器与运行时之间被完整传递，然后在最后一步被丢弃。注：runtime 另一套 HeapLocalObjectAllocator::StartRegion 在同样的失败点留有 // todo gc or oom（LocalObjectAllocator.cpp:528），说明「region 申请不到时该怎么办」这个问题在两套实现里都还没有答案；只是该实现目前是保留的对比实现，不参与生产。", "failure_scenario": "进程原生内存吃紧时，某次进入 @local! 作用域触发的 NativeAlloc 失败，StartLocalRegion 返回 false，但生成代码不检查、继续执行该作用域的函数体。此后该作用域内的 local 分配与 EndRegion 面对的是一个从未成功建立的 region：轻则 local 对象被分配到错误的位置，重则 EndRegion 的帧匹配断言（CompilerCalls.cpp 的 end local heap region with mismatched frame）在运行时 FATAL。无论哪种，用户看到的都不是「内存不足」，而是一个与真实原因无关的崩溃或错误行为。", "suggestion": "确定 region 申请失败的语义并落地：或在 CHIR 层把 StartRegion 的结果类型改成 Bool 并生成失败分支（抛 OutOfMemoryError 是最符合用户预期的做法），或由 runtime 在 StartLocalRegion 内部直接对失败作终局处理（触发 GC 后重试，仍失败则抛 OOM）而不是把 bool 返回给一个不检查的调用方。无论选哪条，都应同时处理 HeapLocalObjectAllocator.cpp:528 的 // todo gc or oom。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "src/CodeGen/Base/ExprDispatcher/OtherExprDispatcher.cpp", "line": 397}, {"repo": "cangjie_runtime", "file": "runtime/src/Heap/Allocator/LocalObjectAllocator.cpp", "line": 1014, "note": "AllocateRegion 在 NativeAlloc 失败时返回 nullptr"}, {"repo": "cangjie_runtime", "file": "runtime/src/CompilerCalls.cpp", "line": 2207, "note": "MCC_StartLocalRegion 返回 bool"}], "posted_file": "src/CHIR/Transformation/SetMemRegion.cpp", "posted_line": 126, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:28+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "4d798b9b38275d8dd2273f197ebf458e886e7207", "has_correction": false, "correction_note": null}, {"id": "L1-09", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "major", "category": "contract", "repo": "cangjie_compiler", "pr": 2065, "file": "schema/PackageFormat.fbs", "line": 108, "title": "同一 namespace PackageFormat 下新增两个同名 Mode（table vs enum），仅因消费者集合不相交才编得过", "detail": "ModuleFormat.fbs:8 与 PackageFormat.fbs:7 都声明 namespace PackageFormat。本次在该命名空间新增：ModuleFormat.fbs:629 的 table Mode { local: LocalMode; }（LocalMode: uint8 {NOT,FULL,HALF}，AST/cjo 侧）与 PackageFormat.fbs:108 的 enum Mode: int16 {NONE,MAYBE,MUST}（CHIR 侧）。种类、底层类型、取值语义均不同，却共用 PackageFormat::Mode 全限定名。当前可编译仅因 ModuleFormat_generated.h（13 个消费文件）与 PackageFormat_generated.h（5 个）交集为空。本条由独立审计发现，L1 初稿的 cjo schema 逐项核对遗漏了同名冲突这一维度。", "failure_scenario": "任何把两个生成头引入同一编译单元的改动（新增同时读 cjo AST 与 CHIR 的工具，或头文件传递包含变化）立即触发重定义错误，报错指向生成代码，排查成本高。即便不触发编译错误，PackageFormat::Mode 在阅读时已有两种含义。", "suggestion": "把 CHIR 侧改名为 ChirMode/CHIRLocalMode，或移入独立 namespace。改名代价随消费者增多上升，越早越便宜。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "schema/ModuleFormat.fbs", "line": 629}], "posted_file": "schema/PackageFormat.fbs", "posted_line": 108, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:43:20+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "0e1976566a51512d652674ac789c83c3a58801a7", "has_correction": false, "correction_note": null}, {"id": "L3-02", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "major", "category": "test-coverage", "repo": "cangjie_test", "pr": 2049, "file": "testsuites/LLT/cjnative_testlist", "line": 125, "title": "三个已识别的高风险点完全没有测试覆盖：保留字兼容性、region 启动失败、跨版本序列化", "detail": "按覆盖矩阵逐点核对（每一条都在 cangjie_test 全仓换多组关键词搜索后才下结论）：(1) exclave/demode 被提升为无条件保留字（L1-07），搜 `(var|let|func)\\s+(exclave|demode)`、`exclave.*(reserved|keyword|identifier)` 均无命中——没有任何用例验证这两个词作标识符时的行为，也就没有用例能在门禁里暴露这个源码兼容性破坏；(2) local region 启动失败（L1-08），搜 StartLocalRegion、`region.*(fail|oom)`、`local.*OutOfMemory` 无命中——NativeAlloc 失败路径无任何覆盖，而该返回值在 CHIR 层被丢弃；(3) 跨版本序列化（L1-01 NodeFormat union tag 偏移、L1-02 cjo 无版本校验）无新旧混用用例，唯一相关的 at_local_macro_good.cj 反而因 # TODO: macro serialization adapt 被排除。作为对照，覆盖到位的有：`extend T @local!` 与 modal type alias 各有负向用例断言 parse_unexpected_modal_type；增量编译有 ExtendModalLocal.cj。", "failure_scenario": "这三类问题的共同特点是不会在正向功能测试里暴露：保留字破坏只在存量代码升级时出现、region 启动失败只在内存压力下出现、跨版本问题只在混用 SDK 时出现。没有针对性用例，门禁全绿也不能说明这些路径是好的；修复之后同样无法验证修复是否有效。", "suggestion": "按风险点补三组用例：(1) 负向用例：exclave / demode 作变量名、函数名、参数名，断言当前行为（若决定保留字化则断言明确诊断，若决定加特性门控则断言未开启时可正常使用）；(2) 运行时用例：构造 local region 分配失败（可通过限制原生内存或注入失败点），断言得到 OOM 而非帧不匹配崩溃；(3) 跨版本用例：用旧格式 cjo / 旧 std.ast 读新产物，断言得到明确诊断而非静默降级。", "confidence": "high", "also_affects": [], "posted_file": "testsuites/LLT/cjnative_testlist", "posted_line": 125, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:17+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "29a99de9ff68f84fcb8364c168771fd02541a26f", "has_correction": false, "correction_note": null}, {"id": "L1-03", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "minor", "category": "contract", "repo": "cangjie_compiler", "pr": 2065, "file": "src/Modules/ASTSerialization/ASTSerializeUtils.cpp", "line": 22, "title": "Mode::IDEAL 逃逸到序列化只有 CJC_ASSERT 防护，release 构建下会写出越界的 LocalMode", "detail": "AstLocalToFormat 的实现是 static_cast<PackageFormat::LocalMode>(static_cast<int>(astModal) - 1)，前面只有一句 CJC_ASSERT(astModal != Mode::IDEAL)。ModalInfo.h 的注释自己写明 IDEAL「Must be resolved (to a concrete modal, defaulting to NOT) before Sema ends; reaching the back end or serialization is a bug」——即作者已知这是可能发生的 bug 路径。CJC_ASSERT 在 release 构建通常被编译掉，此时 IDEAL(0) 会算出 -1，而 PackageFormat::LocalMode 底层类型是 uint8，得到 255。另外 NodeSerialization.cpp:50 对内部 ASTMode → NodeFormat::ASTMode 做裸数值强转，当前两者取值顺序恰好一致所以正确，但没有 static_assert 锁住，日后任一侧调整顺序就会静默错位（内部 Mode 与内部 ASTMode 的 FULL/HALF 顺序已经不一致，说明这类顺序漂移在本仓真实发生过）。", "failure_scenario": "release 版编译器遇到任一条 IDEAL 未被 Sema 消解的路径（例如 func-arg lambda 隐式返回位置上的字面量在某个泛型推断分支里未被 resolve），写出 local=255 的 Mode 字段。读回时 FormatToAstLocal(255) 得到 Mode(256) 截断为 0 = IDEAL，模态信息被污染成一个本不该出现在序列化产物里的值，后续所有基于 Mode 的判断（IsSubModal / operator| 等）行为未定义。", "suggestion": "把 CJC_ASSERT 换成 release 下也生效的处理：要么在 AstLocalToFormat 里对 IDEAL 显式钳到 NOT（与注释所述 default 一致）并留一条诊断，要么改成 InternalError 硬失败。另给 NodeSerialization.cpp:50 补一组 static_assert，锁死内部 ASTMode 与 NodeFormat::ASTMode 的逐值对应。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "src/Macro/NodeSerialization.cpp", "line": 50, "note": "裸数值强转缺 static_assert"}], "posted_file": "src/Modules/ASTSerialization/ASTSerializeUtils.cpp", "posted_line": 22, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:30+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "e7a2d42244f6bb80f5931e70be88423f765b577e", "has_correction": false, "correction_note": null}, {"id": "L2-02", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "minor", "category": "correctness", "repo": "cangjie_compiler", "pr": 2065, "file": "src/CHIR/AST2CHIR/TranslateASTNode/TranslateArrayExpr.cpp", "line": 29, "title": "用 CJC_ABORT() 标记不可达路径，但它在 NDEBUG 下是空宏，release 编译器退化为静默返回 nullptr", "detail": "Translator::Visit(const AST::ArrayExpr&) 删除了原有四条 RawArray 构造路径（共 175 行），非 VArray 分支替换为 CJC_ABORT(); return nullptr;。改道本身是完整的——InitArrayByCollection/InitArrayByItem/InitArrayByLambda 三个函数已彻底移除（定义 0、调用 0），DesugarInTypeCheck.cpp:639 会把 ArrayExpr 标为 isValueArray=true，因此该路径确属不可达标记。问题在于 CheckUtils.h:56 的 #define CJC_ABORT() 在 NDEBUG 下展开为**空**，于是 release 编译器走到这里既不 abort 也无诊断，直接返回 nullptr。作者补了 return nullptr 避免了掉出函数尾的 UB，这一点是对的；但也因此把「立刻暴露」变成了「静默传播」。", "failure_scenario": "若将来某条改动让非 VArray 的 ArrayExpr 重新到达 CHIR 翻译（例如新增一种数组字面量形式、或 desugar 条件被改窄），debug 构建会在正确位置 abort、便于定位；而 release 构建返回一个 nullptr 的 Ptr<Value> 交给 CHIR 构造流程，在后续某个毫不相关的位置空指针解引用崩溃，或生成结构不完整的 CHIR。用户拿到的是一个指向错误位置的 ICE。", "suggestion": "把不可达标记换成 release 下也生效的形式：CJC_ABORT_WITH_MSG 或 InternalError，让 release 构建也给出一条明确的「非 VArray ArrayExpr 到达 CHIR 翻译」内部错误，而不是静默返回 nullptr。", "confidence": "high", "also_affects": [], "posted_file": "src/CHIR/AST2CHIR/TranslateASTNode/TranslateArrayExpr.cpp", "posted_line": 29, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:33+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "4c97dcc667bf6b5386470e8699586776b075db01", "has_correction": true, "correction_note": "更正 L2-02 的建议：CJC_ABORT_WITH_MSG 在 NDEBUG 下同为空宏"}, {"id": "L2-03", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "minor", "category": "contract", "repo": "llvm-project", "pr": 606, "file": "llvm/include/llvm/ADT/StringRef.h", "line": 907, "title": "isCangjieNewObjFunction 名单成对补了 NewObject/NewLocalObject，却没有给 NewFinalizer 配 NewLocalFinalizer", "detail": "本次把 isCangjieNewObjFunction() 的名单从 {CJ_MCC_NewObject, CJ_MCC_NewFinalizer} 扩展为 {CJ_MCC_NewObject, CJ_MCC_NewLocalObject, CJ_MCC_NewFinalizer}——给 NewObject 配了 local 变体，但同一名单里的 NewFinalizer 没有配 CJ_MCC_NewLocalFinalizer，而该符号在本次确实新增了（runtime CompilerCalls.cpp 与 8 个架构的 CalleeSavedStub.S 都有）。该谓词有三个消费者：CJBarrierLowering.cpp:1121 的 isNewObj()（识别分配 statepoint）、CJFillMetadata.cpp:548 的 isNewObjectCallSite()（本次未改动）、以及 CJPartialEscapeAnalysis.cpp:470。第三处经核实不可达（该 pass 的候选收集条件是 startswith(\"CJ_MCC_NewObject\")，local finalizer 进不去），但前两处是否需要识别 local finalizer 对象，未在本次改动中体现取舍依据。", "failure_scenario": "若 barrier lowering 或 metadata 填充需要把 local finalizer 对象识别为「新分配对象」，当前名单会让它被漏掉，其屏障或类型元数据的处理与非 local finalizer 不一致。由于三个消费者的语义未在本次改动中说明，无法静态判定这是有意省略还是漏补——但成对新增中独独缺一个，本身就是需要作者确认的信号。", "suggestion": "请作者确认：CJ_MCC_NewLocalFinalizer 是否应当进入 isCangjieNewObjFunction 名单。若应当，补上即可；若不应当（例如 local finalizer 的屏障/元数据由别处处理），建议在该函数上补一行注释说明为何 NewObject 需要 local 变体而 NewFinalizer 不需要，避免下一个人重复这个疑问。", "confidence": "medium", "also_affects": [{"repo": "llvm-project", "file": "llvm/lib/CodeGen/CJBarrierLowering.cpp", "line": 1121, "note": "isNewObj() 调用点"}, {"repo": "llvm-project", "file": "llvm/lib/Transforms/Scalar/CJFillMetadata.cpp", "line": 548, "note": "isNewObjectCallSite() 调用点，本次未改动"}], "posted_file": "llvm/include/llvm/ADT/StringRef.h", "posted_line": 908, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:36+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "771ebd90615c6e0ee6cb63063422277d4694b1ed", "has_correction": false, "correction_note": null}, {"id": "L1-04", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "nit", "category": "contract", "repo": "cangjie_compiler", "pr": 2065, "file": "demangler/DeCompression.cpp", "line": 526, "title": "覆盖率构建下 demangler 的 try/catch 被 #ifndef CANGJIE_ENABLE_GCOV 剥离，畸形输入由优雅返回变为 terminate", "detail": "本次在 demangler 里新增了 4 处 #ifndef CANGJIE_ENABLE_GCOV，把两处 std::stoll 周围既有的 try/catch 在覆盖率构建下整体去掉（try { 与 } catch (const std::exception&) { return idx; } 两段同时消失，语法仍然成立）。这两处 catch 的职责正是兜住畸形 mangled name 上 std::stoll 抛出的 std::out_of_range / std::invalid_argument 并返回安全值。该改动与 modal/local mode 特性无关，是搭本次 PR 顺带进来的覆盖率构建适配（同批还有 CMakeLists.txt 新增的 CANGJIE_BUILD_STDLIB_WITH_COVERAGE 选项）。　补充核实：`#ifndef CANGJIE_ENABLE_GCOV` 包裹 try/catch 并非本次发明，而是仓内既有惯例——src/Utils/SafePointer.cpp、src/Parse/ParserUtils.cpp、src/Basic/DiagnosticEngine.cpp 等至少三处已有完全相同的写法，CANGJIE_ENABLE_GCOV 全仓被引用二十余处。本次只是把既有房规套用到两个新调用点，因此定级降为 nit。", "failure_scenario": "以 CANGJIE_ENABLE_GCOV 构建的编译器跑测试套时，遇到一个长度数字超出 uint32 或非数字的畸形 mangled name（cjfilt 处理外部符号、或 LLT 里构造的异常符号）：std::stoll 抛出的异常无人接管，直接 std::terminate，整个测试进程中止——而同一输入在生产构建下只是 return idx 安全退出。结果是覆盖率跑批可能在健壮性用例上整批中断，且覆盖率数据恰好覆盖不到这些本该被验证的异常分支。", "suggestion": "不要用宏删掉异常处理来迁就 gcov。若 gcov 与 try/catch 确有冲突（通常是分支计数失真而非编译失败），改为在覆盖率配置里排除这两个函数的分支统计，或把 std::stoll 换成不抛异常的 std::from_chars——后者既消除了 try/catch，也让两种构建行为一致，还能顺带统一 tools 侧那份仍在用 atoi 的历史实现。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "demangler/Demangler.cpp", "line": 287, "note": "同一模式，另一处 std::stoll 的 try/catch"}], "posted_file": "demangler/DeCompression.cpp", "posted_line": 526, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:39+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "b742dd8464cc2361976102c12d0ccb6bdce3b54a", "has_correction": false, "correction_note": null}, {"id": "L1-06", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "nit", "category": "memory-safety", "repo": "cangjie_runtime", "pr": 1697, "file": "runtime/src/Heap/Allocator/RegionManager.cpp", "line": 969, "title": "GC 触发量新增的 local 堆字节项在生产配置下恒为 0，是随死代码一起引入的空占位", "detail": "改动把 allocatedBytes 由 GetAllocatedSize() - gcstats.liveBytesAfterGC 改为 currentHeapBytes = tracingHeapBytes + localHeapBytes 再做饱和减法，注释说明 liveBytesAfterGC 只含 tracing 堆、local 对象会随作用域消失所以用饱和减法。把数据流追到底后结论要修正：localHeapBytes 来自 space.GetLocalObjectAllocator().GetHeapAllocatedBytes()，而 LocalObjectAllocator::InitLocalObjectAllocator （LocalObjectAllocator.cpp:512-521）无条件 new NativeLocalObjectAllocator（注释明写这是生产实现、另一套仅作对比保留、不通过环境变量选择），其 GetHeapAllocatedBytes() 在第 135 行写死 return 0。真正会让该计数非零的 HeapLocalObjectAllocator 按同文件注释是保留的对比实现/死代码。因此生产配置下 localHeapBytes 恒为 0、currentHeapBytes 恒等于 tracingHeapBytes，量纲混用不会发生。这一点也符合设计：native local region 由 NativeAllocator::NativeAlloc 从操作系统直接取内存，本就不在 tracing 堆内。", "failure_scenario": "当前生产配置下不可达。只有在改用 HeapLocalObjectAllocator（目前的保留实现）之后，local 对象随作用域成批消失才会使 currentHeapBytes 反复跌破 liveBytesAfterGC、allocatedBytes 被钳成 0，从而在 tracing 堆确有增长时推迟 GC。记录在此是为了届时不要连同这个量纲不一致一起启用。", "suggestion": "本次改动实际唯一的行为变化是把可能下溢的减法换成饱和减法，属纯粹的安全改进，可以保留。建议给 + localHeapBytes 这一项加注释说明它当前恒为 0；若将来启用 HeapLocalObjectAllocator，需同时让 liveBytesAfterGC 计入 local 存活字节，或把 local 堆增长拆成独立的触发条件。", "confidence": "high", "also_affects": [], "posted_file": "runtime/src/Heap/Allocator/RegionManager.cpp", "posted_line": 969, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:42+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "8b8d0bc879aedcb97acf2254ecde9434f23e17ce", "has_correction": false, "correction_note": null}, {"id": "L2-01", "batch": "b1", "batch_label": "第一批 modal/local mode 主体特性", "issue": "1095", "severity": "nit", "category": "incremental", "repo": "cangjie_compiler", "pr": 2065, "file": "src/IncrementalCompilation/PollutionAnalyzer.cpp", "line": 941, "title": "GetExtendedTypeRawMangleNameImpl 里两条分支补了 modal、另两条没补，但该输入本就不可能带 modal，属死代码不一致", "detail": "起草时把这条记为 major，随后被测试仓的负向用例证伪，现降为 nit 并如实保留：GetExtendedTypeRawMangleNameImpl 的 switch 中，PRIMITIVE_TYPE(:940-941) 与命中 LookupSpecialBuiltinType 的 REF_TYPE(:947) 追加了 MangleUtils::MangleTypeMode(...)，而一般 REF_TYPE 与 QUALIFIED_TYPE 两条分支经 mangled2Decl 查表直接 return pair.first，未追加。**但这两条路径不可达**：cangjie_test 的 Sema/modal/decl/extend_modal_type.cj 与 typealias_modal_type.cj 两个负向用例证明，`extend T @local!` 与 `type L = T @local!` 都在解析期被 parse_unexpected_modal_type 拒绝（各断言 2 个错误），即 extend 的被扩展类型与 type alias 的目标类型都不可能带 modal，TypeAlias 的递归路径同样进不来。因此已补的两条分支本身也是死代码，未补的两条不构成缺陷。", "failure_scenario": "无。该函数的输入不可能携带 modal，四条分支补或不补都不影响结果。唯一的实际影响是可读性：同一 switch 里两条补两条不补，会让后续维护者误以为是漏改（本次检视即如此误判过一次）。", "suggestion": "二选一：要么把 :941/:947 两处已补的 MangleTypeMode 一并去掉并加一行注释说明「extend 的被扩展类型在解析期即禁止携带 modal，此处无需处理」；要么统一在 switch 之后的返回处补齐，保持四条分支一致。前者更贴近事实。", "confidence": "high", "also_affects": [], "posted_file": "src/IncrementalCompilation/PollutionAnalyzer.cpp", "posted_line": 941, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-12T20:33:44+08:00", "days_open": 9, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "da864f7f89d056fd2fe7a25bbdec9fe8bf601b47", "has_correction": false, "correction_note": null}, {"id": "B2-08", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "blocking", "category": "correctness", "repo": "cangjie_tools", "pr": 1285, "file": "cangjie-language-server/test/message/completion/LSP_Completion_2022092107108.base", "line": 1, "title": "提交了一份被截断并混入 gtest 输出的 LSP 补全基线，同一 PR 还静默下线了一条 LSP 用例", "detail": "cangjie_tools#1285 标题为「fix: demangle operator()」，但 8 个改动文件里只有 1 个是 demangler，其余 7 个全在 cangjie-language-server/test/ 下。其中 LSP_Completion_2022092107108.base：merge-base 上是 5000 字节的合法 JSON，本批 head 上变成 3251 字节的**非法 JSON**——在 \"documentation\" 字段中途被截断，并接上了一行测试框架标准输出：`...IncompatiblePackageException <: Exception\",\"docum[       OK ] TypeHierarchy/TypeHierarchyTest.TypeHierarchyCase/29 (1626 ms)`。用 json.loads 双向验证：改动前合法，改动后报 Unterminated string。全仓 completion/*.base 中含 `[ OK ]` 的只有这一个文件，merge-base 上该串出现 0 次，确系本批引入。同一 PR 在 cangjie-language-server/test/testCase.list 删除了一行 {\"applyEdit\":{\"testFile\":\"ExtractInterface_Apply_020.test\",\"method\":\"workspace/applyEdit\"}}，而 ExtractInterface_Apply_020.test 与 .base 仍在盘上、全仓再无任何引用——等于一条 LSP 用例被静默停跑。另外 5 个 .base 也被整体重新生成（新增 UnImplementedException 等补全项）。以上全部无任何说明。", "failure_scenario": "这份 .base 是 LSP 补全的期望输出基线。它现在既不是合法 JSON、也不是任何一次真实运行的完整输出，而是一次跑批中 stdout 与文件内容交错写入的残留。对应用例此后要么恒失败、要么按错误基线比对而恒通过，两种都使该用例失去意义；ExtractInterface_Apply_020 则从此不再执行，其覆盖的 Extract Interface 重构行为无人守护，且因为文件还在盘上，后续排查者会以为它仍在跑。", "suggestion": "(1) 重新生成 LSP_Completion_2022092107108.base，并在提交前校验它是合法 JSON——建议在 LSP 用例的构建或预提交环节加一道 .base 的 JSON 合法性检查，这类「日志串进基线」的事故靠人眼 review 很难发现；(2) 说明 ExtractInterface_Apply_020 下线的原因：若是本批改动导致它失败，应修复而非删除清单项；若确需下线，应连同 .test/.base 一起处理并留下记录；(3) 说明另外 5 个 .base 整体重生成的依据。", "confidence": "high", "also_affects": [{"repo": "cangjie_tools", "file": "cangjie-language-server/test/testCase.list", "note": "静默删除 ExtractInterface_Apply_020"}], "posted_file": "cangjie-language-server/test/message/completion/LSP_Completion_2022092107108.base", "posted_line": 1, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:36+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "44538a631488b5f6ef241b50e53def4a677cc4dc", "has_correction": false, "correction_note": null}, {"id": "B2-01", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "major", "category": "memory-safety", "repo": "cangjie_compiler", "pr": 2131, "file": "src/CodeGen/Base/TupleExprImpl.cpp", "line": 127, "title": "Barrier WriteGeneric SIGABRT 的修复只在编译器侧补路由，runtime 四处 RTLOG_FATAL 守卫与 // todo del 原封不动，而已知问题标记已撤", "detail": "issue #1131 第 3 条「runtime 崩溃：Barrier WriteGeneric SIGABRT」对应上一批检视的 blocking（四处写屏障对 local 对象 RTLOG_FATAL，均标 // todo del）。本批 runtime PR 改了 8 个文件，但不含 Barrier.cpp / TraceBarrier.cpp / EnumBarrier.cpp，四处守卫与 todo 标记全部保留。尤其要指出：四处守卫之一就在 runtime/src/CompilerCalls.cpp:324/326，而该文件本批被改过（改了两处签名与一处内部调用），即作者改到了含守卫的文件仍未处置（现状：Barrier.cpp:216/218、TraceBarrier.cpp:309/311、EnumBarrier.cpp:335/337、CompilerCalls.cpp:324/326；另在 WCollector.cpp:151/184/223/268 还有 4 处 // todo del，全仓共 8 处）。实际修复在编译器侧 TupleExprImpl.cpp:127：enum 关联值写入原先无条件走普通 GC 写屏障，现按 chirEnumType->IsLocalRegion() 选 ModalWriteKind::MAYBE_LOCAL，于是不再落到不支持 local 的 WriteGeneric。修法方向是对的——补路由而非放宽 runtime。问题在于：这三个用例（eq_v7 / rt1_barrier / rt2_region_field）的排除项随之从 cjnative_testlist 撤除，`# runtime Barrier WriteGeneric SIGABRT` 这条理由标签也一并消失，而守卫本身、`// todo del` 的未决状态、以及上一批指出的解释器旁路（InterpreterSpecific.cpp:489 的 WriteGenericField 直接调 Heap::GetBarrier().WriteGeneric，本批仍未触碰）都还在。", "failure_scenario": "下一条绕过 ModalWriteKind 路由、以 local 对象到达 WriteGeneric 的路径（解释器执行、反射、或新增的泛型写场景）仍会 RTLOG_FATAL 终止进程。与上一批不同的是，此时排除清单里已经没有任何条目提示这是已知问题，issue #1131 也已按「修复」收口，排查者拿到的只是一个 GC 屏障里的进程中止，没有任何线索指向这四处 todo。", "suggestion": "给这四处守卫一个明确的定论并落到代码里：若判定编译器路由已穷尽，就说明由哪个分析保证、把 RTLOG_FATAL 降为调试期检查、删掉 // todo del；若尚未穷尽（解释器路径目前就是一条未覆盖的调用者），应在 issue #1131 关闭前单独记录该残留项，避免它随排除项一起消失。WCollector.cpp 的另外 4 处 // todo del 建议一并给出处置结论。", "confidence": "high", "also_affects": [{"repo": "cangjie_test", "file": "testsuites/LLT/cjnative_testlist", "note": "三条排除项被撤"}, {"repo": "cangjie_compiler", "file": "src/CodeGen/Base/TupleExprImpl.cpp", "line": 127, "note": "实际修复处"}], "posted_file": "src/CodeGen/Base/TupleExprImpl.cpp", "posted_line": 127, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:38+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "d6319c49221c1ec83499fd5cb6f16ae841df518e", "has_correction": false, "correction_note": null}, {"id": "B2-05", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "major", "category": "contract", "repo": "cangjie_compiler", "pr": 2131, "file": "src/Sema/TypeCheckDecl.cpp", "line": 112, "title": "IDEAL 泄漏被本批确认为真实缺陷并做了点修复，但序列化侧的 assert-only 兜底未随之加固", "detail": "本批在 TypeCheckDecl.cpp 新增 SuspendFuncArgLambdaBodyGuard，注释原文：「NeedSynOnUsed may CheckFuncDecl while inFuncArgLambdaBody > 0 (lambda arg of a generic call). Without suspending the counter, literals in that callee keep Mode::IDEAL and leak to CHIR」，并给出了具体复现代码。这证实了 Mode::IDEAL 逃逸不是理论风险而是已发生的缺陷。但 ASTSerializeUtils.cpp 本批完全未被触碰，AstLocalToFormat 仍是：`CJC_ASSERT(astModal != Mode::IDEAL); return static_cast<PackageFormat::LocalMode>(static_cast<int>(astModal) - 1);`——CJC_ASSERT 在 NDEBUG 下被编译掉，IDEAL(0) 会算出 -1，而 LocalMode 底层类型是 uint8，写出 255。本批修的是当前已知的那一条泄漏路径，兜底则维持原状。　补充两点以免失之偏颇：(1) 本批确实新加了一道检查——src/AST/ASTTypeValidator.cpp:61 把 !node.GetTy().IsIdealModal() 并入了 valid，但它同样只喂给 CJC_ASSERT，属断言级，release 下不生效；(2) 本批的 guard 注释证明的是 IDEAL 泄漏到 **CHIR**，而本条关注的是泄漏到**序列化**，两者是不同路径。因此本条的依据不是「已在序列化路径实证」，而是「IDEAL 逃逸已被证明会真实发生，且序列化侧的兜底在 release 下等于没有」。", "failure_scenario": "下一条未被 SuspendFuncArgLambdaBodyGuard 覆盖的 IDEAL 泄漏路径（该 guard 只处理 NeedSynOnUsed→CheckFuncDecl 且 inFuncArgLambdaBody>0 这一种情形）在 release 构建下写出 local=255 的 Mode 字段；读回时 FormatToAstLocal(255) 得到 Mode(256) 截断为 0 = IDEAL，模态信息被污染成一个不应出现在序列化产物里的值，后续 IsSubModal / operator| 等判断行为未定义。debug 构建会在断言处停下，release 构建静默产出错误 cjo。", "suggestion": "把 AstLocalToFormat 的断言换成 release 下也生效的处理：对 IDEAL 显式钳到 NOT（与 ModalInfo.h 注释所述 default 一致）并留一条诊断，或改为 InternalError 硬失败。点修复与兜底加固应当一起做——本批已经证明这条路径会真实触发。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "src/Sema/TypeCheckDecl.cpp", "note": "本批的点修复处"}], "posted_file": "src/Sema/TypeCheckDecl.cpp", "posted_line": 112, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:41+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "cac1c4a1a0647aa3d67a08b6262c2d3c4bfa6d6a", "has_correction": false, "correction_note": null}, {"id": "B2-09", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "major", "category": "test-coverage", "repo": "cangjie_test", "pr": 2146, "file": "testsuites/LLT/compiler/Sema/modal/runtime/constrained_retry.cj", "line": 8, "title": "两条「恢复」的用例是把期望退出码从 0 改成 1 实现的，constrained_retry 因此变成只有断言失败才算通过", "detail": "这两条用例本批从 `# runtime, core dump or result error` 排除项中撤出，同时把指令由 `// EXEC: %run ...` 改为 `// EXEC-1: %run ...`。`EXEC-N` 的语义是期望退出码 N，这一点可由仓内既有用法佐证：Sema/modal/parse/parse_local_end.cj:7 与 Sema/modal/expr/exclave/sema_exclave_in_ctor.cj:7 用 `EXEC-1: %compiler` 标负向编译用例。问题在于 constrained_retry.cj 的 main() 结构是：`var failed = 0; failed += assertB(...); ...; if (failed > 0) { return 1 }; return 0`——即「断言失败返回 1、全部通过返回 0」。改成 EXEC-1 之后，**这条用例只有在它自己的断言失败时才算通过**，全部断言通过反而判为失败。eq_v4.cj 的 main() 末尾是 `return 0` 且无失败分支，期望退出码 1 等于期望进程非正常结束。作为对照，同批另外几条是实打实的修复或加强：cmp5_for_lambda.cj 把 SCAN 期望值 form1=10 改为 14（a=[5,6,7]、f=v*2、acc=f(7)=14，是把错的期望改对），eq_v7.cj 与 rt2_region_field.cj 由裸 EXEC 升级为 RUN-EXEC-PIPE + ASSERT: scan。", "failure_scenario": "这两条用例此后不再守护任何行为：constrained_retry 在功能被修好时报失败、在功能退化时报通过；eq_v4 则要求进程以非 0 码退出。它们从排除清单撤出、看起来像是恢复了，门禁上也会显示通过，但实际提供的是反向信号——比留在排除清单里更有害，因为排除清单至少是显式的。", "suggestion": "请说明 EXEC-1 的依据。若这两条用例当前确实还会失败/崩溃，正确做法是留在排除清单并附 issue 号，而不是把失败固化成期望值；若是误改，应改回 `EXEC:`。另建议复核 constrained_retry.cj 中「之前触发 ICE 的形态」等注释是否仍然成立——本批删除了该注释但保留了用例。", "confidence": "high", "also_affects": [{"repo": "cangjie_test", "file": "testsuites/LLT/compiler/Sema/modal/runtime/eq_v4.cj", "line": 8}], "posted_file": "testsuites/LLT/compiler/Sema/modal/runtime/constrained_retry.cj", "posted_line": 8, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:44+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "995b3e48d3f1cedeff3f6f3b4cb5224cdc23736f", "has_correction": false, "correction_note": null}, {"id": "B2-10", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "major", "category": "semantics", "repo": "cangjie_compiler", "pr": 2131, "file": "src/Sema/TypeCheckCall.cpp", "line": 1785, "title": "新增的两处 enum 构造 modal 盖章缺少同文件既有写法的两道 guard，请确认是否有意", "detail": "本批在 TypeCheckCall.cpp 新增两处（:1785 与 :1945）：`if (auto ref = ce.baseFunc->GetTarget(); ref && ref->TestAttr(Attribute::ENUM_CONSTRUCTOR)) { ce.SetTy(ce.GetTy().With(target.Mode())); }`。同文件针对同一属性的既有处理（ReInferCallArgs，:2529-2533）是：`if (ce.modal.HasLocal()) { instTy = instTy.With(ce.modal.ToModalInfo()); } else if (target) { instTy = instTy.With(target.Mode()); }`——即**显式写出的 ce.modal 优先**，且 **target 需非空**。class/struct 的同类盖章（:2472-2478）guard 更严，还额外判 Ty::IsTyCorrect(target) 与 !ce.GetTy().IsLocalType()。新增的两处这两道 guard 都没有。另注 :1944 刚执行 `ce.SetTy(GetCallTy(ctx, ce, fmu.fd));`，:1945 随即无条件覆盖其模态。本条以求证口径提出：未构建验证，无法断言必然出错。", "failure_scenario": "若存在 target 为默认构造 ModalTy{}（其 ModalInfo 默认 local=Mode::NOT）的调用路径——例如无期望类型的 enum 构造合成——则 `.With(target.Mode())` 会把结果类型无条件盖成 NOT，覆盖掉 GetCallTy 已算出的模态，也覆盖掉调用点显式写的 @local!。这恰是 issue #1131 第 2 条「enum @local? 构造在了堆上」的症状形态，只是换到合成路径上。", "suggestion": "请确认：这两处是否应当与 ReInferCallArgs 一致，补上 `ce.modal.HasLocal()` 优先与 `target` 非空两道 guard？若 enum 与 class/struct 在此处确实应有不同待遇，建议加一行注释说明，否则同文件三处同类盖章的 guard 集合各不相同，后续维护难以判断哪个是对的。", "confidence": "medium", "also_affects": [{"repo": "cangjie_compiler", "file": "src/Sema/TypeCheckCall.cpp", "line": 1945, "note": "同一模式的第二处"}], "posted_file": "src/Sema/TypeCheckCall.cpp", "posted_line": 1785, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:47+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "61d34ef5c3b98faed482ca83eb53b6cf16bb8dc5", "has_correction": false, "correction_note": null}, {"id": "B2-11", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "major", "category": "semantics", "repo": "cangjie_compiler", "pr": 2131, "file": "src/CodeGen/IRBuilder.h", "line": 439, "title": "模态写屏障路由只补了一半：InitArrayData 漏改，且三个签名改为带默认实参、默认方向是非 local", "detail": "本批把模态分派补进了若干写点（CJNativeIRBuilder.cpp:1476、:1686 的 InitArrayDataUG 等），但姊妹函数 InitArrayData（:1697-1748）的引用元素分支 :1738 仍是裸 `irBuilder.CallGCWrite({value, arrPtr, elemPtr})`。两者由 CallArrayInit 按元素 CGType 有无 size 分流，元素为具体引用类型的 @local! 数组走的正是未加路由那条；InitArrayData 不接 arrTy，而调用方手里就有，改动代价极低。同时三个签名被改为带默认实参：CallGCWrite(args, ModalWriteKind = NONE)、CallIntrinsicGCWriteGeneric(params, bool isLocal = false)、CallIntrinsicAllocaGeneric(params, bool isLocal = false)——其中 CallIntrinsicAllocaGeneric 的 isLocal **改动前是必填参数**。现存依赖默认值的调用点有三处：CJNativeIRBuilder.cpp:1738、CJNativeIntrinsicsCall.cpp:403、:970。其中 :967-970 最直观：上一行 `CallIntrinsicAllocaGeneric({...}, rstType->IsLocalRegion())` 明确按模态分配了可能是 local 的 box，下一行 `CallGCWrite({res, boxVal, payloadPtr})` 却用默认的非 local 屏障写它。", "failure_scenario": "元素为具体引用类型的 @local! 数组做元素写入时走 InitArrayData 的裸 CallGCWrite，用非模态屏障写 local region 中的对象；:970 的 box 同理。后果与 issue #1131 第 3 条同类——要么落到不支持 local 的写屏障上触发 RTLOG_FATAL，要么漏掉 local 记账。更长远的风险是把必填参数改成默认实参：编译器从此不再强制每个新增调用点做模态决策，而默认方向恰好是「非 local」，下一个写点很容易在无人察觉的情况下走错分支。", "suggestion": "(1) 给 InitArrayData 补上与 InitArrayDataUG 一致的 `arrTy.IsLocalRegion() ? MAYBE_LOCAL : NONE`；(2) 复核 CJNativeIntrinsicsCall.cpp:403 与 :970 两处是否应传模态，:970 尤其明显；(3) 建议把 CallIntrinsicAllocaGeneric 的 isLocal 改回必填——模态决策适合强制显式，默认值会让漏改静默通过。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "src/CodeGen/CJNative/CJNativeIRBuilder.cpp", "line": 1738, "note": "InitArrayData 漏加分派"}, {"repo": "cangjie_compiler", "file": "src/CodeGen/CJNative/CJNativeIntrinsicsCall.cpp", "line": 970, "note": "按 IsLocalRegion 分配、却用默认非 local 屏障写"}], "posted_file": "src/CodeGen/IRBuilder.h", "posted_line": 439, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:50+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "72b59461be38bca8324b2110710f485884bfb42a", "has_correction": false, "correction_note": null}, {"id": "B2-02", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "minor", "category": "correctness", "repo": "cangjie_compiler", "pr": 2131, "file": "include/cangjie/AST/Walker.h", "line": 42, "title": "NodeStackT 类注释声称四个方法都 AutoDesugar、stack 是 mutable，实际只有 Push 会 desugar 且没有 mutable", "detail": "新增的类注释（Walker.h:41-44）原文：「Mid-check desugaring may attach desugarExpr to a node already on the stack. Push, Pop, operator[], and FindFirstOf rewrite the accessed slot via AutoDesugar before returning or applying predicates, so callers always observe the sugar-free node. `stack` is mutable so const accessors can perform that rewrite without dropping const on the NodeStackT.」逐条比对实现：Push（Walker.cpp:40-43）是 `stack.push_back(AutoDesugar(n))`——在**入栈时**求值，不是「rewrite the accessed slot」；Pop（:46-49）是纯 `stack.pop_back()`，无 AutoDesugar；operator[]（:34-37）是 `return stack[stack.size()-i-1];`，无 AutoDesugar；FindFirstOf（:52-64）函数体与改动前逐字相同，只是从头文件挪进 .cpp，同样无 AutoDesugar。`mutable` 在 Walker.h 与 Walker.cpp 中只出现在这句注释里，成员声明第 88 行是普通的 `std::vector<Ptr<NodeT>> stack;`。更关键的是：注释自陈的动机「desugarExpr 挂到**已经在栈上**的节点」恰恰是入栈时 desugar 无法覆盖的场景——节点入栈时若尚无 desugarExpr，之后再挂上，operator[] 与 FindFirstOf 返回的仍是糖节点。", "failure_scenario": "后续维护者读到「callers always observe the sugar-free node」，据此写出依赖 operator[] 或 FindFirstOf 自动脱糖的代码，而这两个方法并不脱糖——得到的是糖节点，类型判断（Is<CallExpr> 之类）结果与预期相反，且因为注释白纸黑字写着相反的保证，排查时极易被误导。当前唯一的外部消费者 TypeCheckCall.cpp:762 靠自己在谓词里跳过带 desugarExpr 的节点绕开了这一点，所以现网行为正确。", "suggestion": "二选一并使注释与实现一致：(1) 若要的就是入栈时脱糖，把注释改为「Push desugars at push time; Pop/operator[]/FindFirstOf do not」，并删掉不存在的 `mutable` 一句与「已经在栈上的节点」这个它覆盖不了的动机；(2) 若确实需要覆盖「已在栈上再挂 desugarExpr」，则要在 operator[] 与 FindFirstOf 里真正做 AutoDesugar，并把 stack 声明为 mutable。从当前唯一消费者的写法看，(1) 更贴近实际需要。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "src/AST/Walker.cpp", "line": 34}], "posted_file": "include/cangjie/AST/Walker.h", "posted_line": 42, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:52+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "860e3c2855d55dbdc3475094574893252958d95a", "has_correction": false, "correction_note": null}, {"id": "B2-03", "batch": "b2", "batch_label": "第二批 local enum / demangle 修复", "issue": "1131", "severity": "minor", "category": "correctness", "repo": "cangjie_compiler", "pr": 2131, "file": "src/Sema/TypeCheckCall.cpp", "line": 767, "title": "FilterNestedCtorCall 的谓词里 while 循环是死代码，被前置 if 完全遮蔽", "detail": "谓词写作：\n    auto expr = DynamicCast<Expr>(n);\n    if (!expr || expr->desugarExpr) { return false; }\n    while (expr->desugarExpr) { expr = expr->desugarExpr.get(); }\n    return expr != &ce && Is<CallExpr>(expr);\n前置 if 已保证走到 while 时 expr->desugarExpr 必为空，循环体永不执行。该循环体与 Walker.cpp 的 NodeStackT::AutoDesugar 实现完全相同，属同一逻辑的第三份副本（AutoDesugar 一份、此处一份），且这一份不可达。", "failure_scenario": "无运行期影响。代价在可读性：这段代码看起来是「跳过糖节点**或**跟随到脱糖节点」两种处理并存，实际只有前者生效，读者需要自己推导才能发现后者是死的；若日后有人删掉前置 if 的 `|| expr->desugarExpr` 条件，语义会从「跳过」静默变成「跟随」，而这两者对 outerCall 的判定结果不同。", "suggestion": "删掉 while 循环。若本意是「跟随而非跳过」，则应改前置 if 并直接复用 NodeStackT::AutoDesugar，而不是再抄一份。", "confidence": "high", "also_affects": [], "posted_file": "src/Sema/TypeCheckCall.cpp", "posted_line": 767, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:31:55+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "b27ccbd2512ae5d0f00693672ee1df67532178eb", "has_correction": false, "correction_note": null}, {"id": "B2-0 "category": "test-coverage", "repo": "cangjie_test", "pr": 2146, "file": "testsuites/LLT/compiler/Sema/modal/runtime/eq_v7.cj", "line": 8, "title": "eq_v7.cj 的 RUN-EXEC-PIPE 指令里 %run_args 与 2>&1 之间缺一个空格", "detail": "本行为 `// RUN-EXEC-PIPE: %run %run_opt %output %run_args2>&1 | compare %f`，同批加的 rt2_region_field.cj:8 写的是 `%run_args 2>&1`。全仓 `run_args2` 只出现两次（另一处是 HLT/Benchmark 下一个历史用例）。%run_args 为空时两种写法等价；非空时会多出一个以 `2` 结尾的实参且 stderr 不再重定向，而本用例的 ASSERT: scan-begin / scan-next 正依赖管道内容。", "failure_scenario": "当 %run_args 被赋值的配置下运行，stderr 不进管道、且多传一个实参，scan 断言比对的内容与预期不符，表现为与改动无关的用例失败。", "suggestion": "补一个空格，与同批 rt2_region_field.cj 保持一致。", "confidence": "high", "also_affects": [], "posted_file": "testsuites/LLT/compiler/Sema/modal/runtime/eq_v7.cj", "posted_line": 8, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-17T20:32:05+08:00", "days_open": 4, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "05d0c6260d4cd2db922eae2a3d3167799e2cec0f", "has_correction": false, "correction_note": null}, {"id": "B3-01", "batch": "b3", "batch_label": "第三批 local type 实现优化", "issue": "runtime#888", "severity": "major", "category": "memory-safety", "repo": "cangjie_runtime", "pr": 1781, "file": "runtime/src/Heap/Barrier/Barrier.cpp", "line": 216, "title": "写屏障守卫大幅调整：8 处降为 debug-only、4 条删除、1 条 release CHECK 删除、1 条 release FATAL 新增；而编译器同期把可证 local 的写路由进了本函数", "detail": "上一批 B2-01（major）指出「四处 RTLOG_FATAL 守卫 + // todo del」未处置。本批的处置远不止降级，逐项核对如下：(1) **8 处**守卫被包进 #if defined(MRT_DEBUG) && (MRT_DEBUG == 1)，对应删除 8 处 // todo del——CompilerCalls.cpp 的 MCC_WriteStructField 1 处，Barrier.cpp / TraceBarrier.cpp / EnumBarrier.cpp 的 WriteGeneric 各 1 处，WCollector.cpp 的 EnumRefFieldRoot / EnumAndTagRawRoot / TraceRefField / GetAndTryTagObj 共 4 处；(2) **4 条 RTLOG_FATAL 被整体删除**：\"field must not reference another mutator's local object\"、\"heap object must not reference local object\"、\"field must reference heap object, current local object or null\"、\"demode field must not reference local object\"；(3) **1 条 release 生效的校验被删除**：MCC_DemodeWriteRef 里的 CHECK_DETAIL(objIsHeap || objIsLocal, \"DemodeWriteRef obj must be managed object\")；(4) **1 条 release 生效的 RTLOG_FATAL 新增**，且触发面比它替换掉的更宽：新条件是 Heap::IsHeapAddress(obj) && value != nullptr && !Heap::IsHeapAddress(value)，即任何 heap owner 写入非 heap 非 null 的 value 都会 FATAL。　与此同时 Barrier::WriteGeneric 的函数体一行未改，仍只按 Heap::IsHeapAddress 分支；而同一 PR 给**读**路径实现了真正的 local 支持（新增 ReadGenericToLocalObject / ReadGenericFromLocalObject，对有 ref field 的 local 对象走 GC bitmap、注册 local root、分段拷贝）。　**耦合证据**：同批 compiler#2162 把 ownerMode==MUST && valueMode==MUST 的写判为 ModalWriteKind::NONE，而 CJNativeIRBuilder.cpp:827 的 EmitOpaqueFieldWriteBarrier 以 `store.modalWrite != NONE` 作为 isLocal 传给 CallIntrinsicGCWriteGeneric——即受影响的不止 ref 写，opaque/generic 字段写同样从 local-aware 通道切到 cj_gcwrite_generic，最终落到 Barrier::WriteGeneric。两条通道的实质差别是：MCC_MaybeLocalWriteGeneric → MaybeLocalWriteStruct 逐 ref field 处理、对 heap value 会 AddLocalRoot；而 WriteGeneric 对两个 native local 对象是整段裸 memcpy_s，不逐字段、不注册 local root。", "failure_scenario": "不需要假设 GC 缺陷即可陈述的事实是：编译器这次主动把「owner 可证为 local」的字段写路由进了一个函数，而该函数自己的断言原文就写着 \"Barrier::WriteGeneric does not support local object\"——同一批又把这句断言在 release 下编译掉了。由于门禁只跑 release 构建，这 8 处 debug-only 守卫在 CI 里一次都不会触发；若该路径确有问题，门禁结构上发现不了。另外新增的那条 release FATAL 触发面被放宽到「heap owner 写入任何非 heap 非 null 值」，若存在合法的 heap→非托管指针写入场景（如 CPointer 字段），会变成新的误杀。", "suggestion": "(1) 明确 WriteGeneric 对 local 对象的定位：若裸 memcpy 是正确的（local region 不参与 tracing），请说明为何读路径需要 bitmap + local root 注册而写路径不需要，并把结论写进函数注释；若不正确，应实现与读路径对称的写路径。(2) 8 处守卫建议改为 release 下也生效的形式（CHECK_DETAIL 一类）——门禁只跑 release，#if MRT_DEBUG 等于这道校验不存在。(3) 请说明被删除的那 4 条 FATAL 与 1 条 release CHECK_DETAIL 各自的删除依据（是不变式已由别处保证，还是判定已不再成立）。(4) 新增的那条 release FATAL 触发条件比原条件宽，请确认是有意收紧。", "confidence": "high", "also_affects": [{"repo": "cangjie_runtime", "file": "runtime/src/Heap/WCollector/TraceBarrier.cpp", "line": 311}, {"repo": "cangjie_runtime", "file": "runtime/src/Heap/WCollector/EnumBarrier.cpp", "line": 337}, {"repo": "cangjie_runtime", "file": "runtime/src/CompilerCalls.cpp", "line": 324}, {"repo": "cangjie_runtime", "file": "runtime/src/Heap/WCollector/WCollector.cpp", "line": 153}], "posted_file": "runtime/src/Heap/Barrier/Barrier.cpp", "posted_line": 216, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-22T13:26:22+08:00", "days_open": 0, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "ae75cf8cf174a2d37f372ef1c37643b58efb2e6e", "has_correction": false, "correction_note": null}, {"id": "B3-05", "batch": "b3", "batch_label": "第三批 local type 实现优化", "issue": "runtime#888", "severity": "major", "category": "semantics", "repo": "cangjie_runtime", "pr": 1781, "file": "runtime/src/Heap/Allocator/LocalObjectUtil.h", "line": 15, "title": "本 PR 的核心机制变更（IsLocalObject 改为读对象头状态位）及四项伴随改动，建议单独说明", "detail": "**(a) 主线机制变更**：LocalObjectUtil.h 的 IsLocalObject 由「向 allocator 查 region 地址范围」（`theAllocator.GetLocalObjectAllocator().IsLocalAddress(addr, mutator)`）改为「读对象头状态位」（`obj != nullptr && obj->IsLocalObject()`），mutator 参数取消，LocalObjectAllocator::IsLocalAddress 虚接口整体删除。StateWord 新增 LOCAL_OBJECT=4、STATE_BIT_COUNT 由 2 改 3、BaseObject 新增 SetLocalClassInfo/InitializeLocal——编译器侧的 48 位掩码只是这一变更的下游产物。新引入的依赖是：**每个 local 对象都必须经 SetLocalClassInfo/InitializeLocal 打标**，而 SetTypeInfo / SetClassInfo 都不清状态位；任一条漏走打标的 local 分配会被判成非 local。\n**(b) O(1) 索引删除**：开放寻址哈希表 LocalRegionIndex（约 130 行）整体移除（仓内残留 0 处），FindRegionOfObject 改为沿 region 链线性走的 FindRegionByAddress。而 VisitLocalObjectRefFields 的 checker 是`[&](BaseObject* obj){ return FindRegionOfObject(mutator, obj) != nullptr; }`，每个 root 调一次——在 region 链较深时由 O(n) 退化为 O(n²)。PR 标题为 Optimize the implementation of local type，此项方向相反。\n**(c) 新增公开 API 且每次调用一次 STW**：stdlib 新增 public func getAllocatedLocalObjectSize()，其实现 MCC_GetAllocatedLocalObjectSize（CompilerCalls.cpp:532）含 `ScopedStopTheWorld stw(...)`；对照 MCC_GetAllocatedHeapSize（:530）是无 STW 的单行实现。这是本批唯一的对外 API 新增。\n**(d) @Frozen 范围外**：hash_map.cj 给 HashMap.forEach 三个重载都加了 @Frozen，其中 `@When[env ONE || (ownerMode == MUST && valueMode == MUST)) return NONE;`，即 local!→local! 的写不再走 maybe.local.write.ref，而走普通 gcwrite.ref。ownerModal 来自 ModalWrite.cpp:91 的 `result.ownerModal = current->GetModalInfo()`，是 CHIR **静态类型**上的模态，因此正确性依赖「静态 MUST ⇒ 运行期非 tracing-heap」。　**该前提在当前仓里成立**，但保证它的机制全在 runtime 侧、且编译器侧没有任何对应检查：(a) LocalObjectAllocator.cpp 的 InitLocalObjectAllocator 硬编码 `new NativeLocalObjectAllocator()`，注释明说 heap 版仅作 future fallback、不经环境变量选择；(b) 看似「回退到堆」的 HeapManager::AllocateLocal → RegionSpace::Allocate(AllocType::LOCAL_OBJECT) 实为委回同一个 native allocator（TryAllocateOnce），是带重试的循环而非堆分配；(c) 即便将来切到 HeapLocalObjectAllocator，owner 变成堆地址后 MCC_WriteRefField 会走全屏障分支，是保守安全而非漏标。　问题因此不是「会漏标」，而是：这条不变式没有写在任何一侧的注释里，编译器基于它做了优化，而同批 runtime 又把能发现违例的告警降为 debug-only（见 B3-01）。同文件上方针对 isDemode 的既有注释只论证了反方向（NONE ⇒ heap），正方向（MUST ⇒ region）无论证。　影响面也不止 ref 写：CJNativeIRBuilder.cpp:827 以 `modalWrite != NONE` 作为 isLocal，opaque/generic 字段写同样受这次判定变更影响。", "failure_scenario": "当前配置下不可达——native allocator 被硬编码选用，local! 对象不会落在 tracing heap 上。记录在此是因为：该不变式一旦因 allocator 选型变化、或新增一条能让 local! 静态类型指向堆对象的路径而不成立，编译器侧没有任何检查会发现，而 runtime 侧对应的告警已在同一批里降为 debug-only、门禁又只跑 release。即这条优化把安全性押在了一个跨仓、未文档化、且校验刚被移出门禁覆盖范围的前提上。", "suggestion": "把「静态 MUST ⇒ 运行期非 tracing-heap」这条不变式写进 ModalWrite.cpp 本处注释，并指明它由 InitLocalObjectAllocator 的 allocator 选型保证——同文件已有的 isDemode 注释给出了反方向论证，本处缺正方向的。若将来要启用 HeapLocalObjectAllocator，本处快路径需同步复核。另建议补一条用例：构造 local!→local! 字段写，断言其走了预期屏障路径。", "confidence": "high", "also_affects": [{"repo": "cangjie_runtime", "file": "runtime/src/Heap/Barrier/Barrier.cpp", "line": 216, "note": "同期把对应的运行期告警降为 debug-only"}], "posted_file": "src/CodeGen/Utils/ModalWrite.cpp", "posted_line": 154, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-22T13:26:28+08:00", "days_open": 0, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "3e9bc3af91d1cf0884e8949dd7c68dcef39e4da5", "has_correction": false, "correction_note": null}, {"id": "B3-03", "batch": "b3", "batch_label": "第三批 local type 实现优化", "issue": "runtime#888", "severity": "minor", "category": "contract", "repo": "cangjie_runtime", "pr": 1781, "file": "runtime/src/Common/StateWord.h", "line": 36, "title": "对象头的 48 位 TypeInfo 指针假设成为承重约束，但 SetTypeInfo 对超界地址是静默截断且无断言", "detail": "本批把 STATE_BIT_COUNT 由 2 改为 3 并新增 LOCAL_OBJECT = 4，使 local 对象成为第一类会在对象头里带上非零状态码的对象；编译器侧因此在 GetTypeInfoFromObject 新增了 `& 0x0000FFFFFFFFFFFF` 掩码。两侧布局核对一致：StateWord 把 TypeInfo 拆成 typeInfoLow32 + typeInfoHigh16（HIGH_ADDRESS_SHIFT = 32），指针占低 48 位、ObjectState 占高 16 位。掩码本身正确，编译器侧读对象头 TypeInfo 的入口也确认只有GetTypeInfoFromObject 一处、覆盖完整。问题在于 SetTypeInfo 的实现是 `this->typeInfoHigh16 = (address >> HIGH_ADDRESS_SHIFT) & HIGH_ADDRESS_MASK;`——高于 48 位的地址被**静默截断**，没有任何断言。该写法早于本批存在，但本批让它第一次成为 local 对象也依赖的承重约束。　另有一条比 LA57/LVA 更近的约束：ObjectState::stateCode 是 `uint16_t stateCode : STATE_BIT_COUNT`，本批把 STATE_BIT_COUNT 由 2 改为 3，而新增的 LOCAL_OBJECT = 4 = 0b100 **恰好占满 3 位**。再加一个状态码就会溢出到第 4 位、越过 48 位边界，而 STATE_BIT_COUNT 与编译器侧的 0x0000FFFFFFFFFFFF 掩码之间没有任何 static_assert 把它们钉在一起（该文件已有的两条 static_assert 都不管这个）。", "failure_scenario": "在启用 5 级页表（x86_64 LA57）或 52 位虚拟地址（aarch64 LVA）的系统上，若 TypeInfo 被分配到 2^48 以上，SetTypeInfo 会截掉高位、GetTypeInfo 取回一个错误指针，后续所有基于 TypeInfo 的类型判断行为未定义。当前 Linux 默认不会把用户态地址分配到 2^47 以上（需 mmap 显式 hint），所以实际不易触发，但这是一条没有写下来、也没有检查的不变式。", "suggestion": "(1) 给 SetTypeInfo 加断言，确保 address 落在 48 位内；(2) 更要紧的是加一条 static_assert 把 STATE_BIT_COUNT 与「TypeInfo 占低 48 位」钉在一起——当前 LOCAL_OBJECT=4 已占满 3 位，下一个状态码会静默越界；(3) 在 StateWord 类注释里写明该布局与编译器侧掩码的配对关系，这条跨仓契约目前只存在于两侧各自的实现里。", "confidence": "high", "also_affects": [{"repo": "cangjie_compiler", "file": "src/CodeGen/CJNative/CJNativeIRBuilder.cpp", "note": "编译器侧按 0x0000FFFFFFFFFFFF 掩码，与此布局配对"}], "posted_file": "runtime/src/Common/StateWord.h", "posted_line": 36, "state": "未响应", "resolved": false, "replies": [], "posted_at": "2026-09-22T13:26:31+08:00", "days_open": 0, "owner": "songjian (kkkkkkkbbbbbbb)", "discussion_id": "f5586542a13eb5790cf2fe389894ce9318adb280", "has_correction": false, "correction_note": null}, {"id": " <script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById('findings-data').textContent);
  var DATA = RAW.findings;
  var FETCHED_AT = RAW.fetched_at;

  var SEV_ORDER = ["blocking","major","minor","test","nit"];
  var SEV_LABEL = {blocking:"BLOCKING",major:"MAJOR",minor:"MINOR",test:"TEST",nit:"NIT"};
  var STATE_ORDER = ["未响应","已回复","已解决","未找到线程"];
  var STATE_CLASS = {"未响应":"state-open","已回复":"state-replied","已解决":"state-resolved","未找到线程":"state-unknown"};

  function fmtDate(iso){
    if(!iso) return "—";
    try{
      var d = new Date(iso);
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    }catch(e){ return iso; }
  }
  document.getElementById('fetchedAt').textContent = fmtDate(FETCHED_AT);
  document.getElementById('footFetched').textContent = "matched.json fetched_at: " + FETCHED_AT;

  function prUrl(repo, pr){
    return "https://gitcode.com/Cangjie/" + repo + "/merge_requests/" + pr;
  }
  function batchShortLabel(f){
    return f.batch === 'b1' ? '第一批 #'+f.issue : (f.batch === 'b2' ? '第二批 #'+f.issue : f.batch_label);
  }

  // ---------- KPI ----------
  function buildKPI(){
    var total = DATA.length;
    var resolved = DATA.filter(function(f){return f.state==="已解决";}).length;
    var blockingMajor = DATA.filter(function(f){return f.severity==="blocking"||f.severity==="major";});
    var bmResolved = blockingMajor.filter(function(f){return f.state==="已解决";}).length;
    var openCount = DATA.filter(function(f){return f.state==="未响应";}).length;
    var owners = Array.from(new Set(DATA.map(function(f){return f.owner;})));

    var tiles = [
      {cls:"", num: total, lbl:"检视意见总数"},
      {cls: resolved>0 ? "accent":"", num: resolved+" / "+total, lbl:"已解决"},
      {cls: bmResolved>0 ? "accent":"warn", num: bmResolved+" / "+blockingMajor.length, lbl:"blocking+major 闭环"},
      {cls: openCount>0 ? "warn":"", num: openCount, lbl:"仍未响应"},
      {cls:"", num: owners.length===1 ? "1 人" : (owners.length+" 人"), lbl:"责任人（"+(owners[0]||"—").split(" ")[0]+"）"}
    ];
    var grid = document.getElementById('kpiGrid');
    grid.innerHTML = tiles.map(function(t){
      return '<div class="kpi '+t.cls+'"><div class="num">'+t.num+'</div><div class="lbl">'+t.lbl+'</div></div>';
    }).join("");
  }

  // ---------- filters state ----------
  var activeSev = new Set(SEV_ORDER);
  var activeState = new Set(STATE_ORDER);
  var activeRepo = "";

  function buildFilterChips(){
    var sevWrap = document.getElementById('sevFilters');
    SEV_ORDER.forEach(function(sev){
      var n = DATA.filter(function(f){return f.severity===sev;}).length;
      var chip = document.createElement('span');
      chip.className = 'chip active sev-'+sev;
      chip.textContent = SEV_LABEL[sev]+' ('+n+')';
      chip.dataset.sev = sev;
      chip.onclick = function(){
        if(activeSev.has(sev)){ activeSev.delete(sev); chip.classList.remove('active'); }
        else { activeSev.add(sev); chip.classList.add('active'); }
        render();
      };
      sevWrap.appendChild(chip);
    });
    var stateWrap = document.getElementById('stateFilters');
    STATE_ORDER.forEach(function(st){
      var n = DATA.filter(function(f){return f.state===st;}).length;
      if(n===0) return;
      var chip = document.createElement('span');
      chip.className = 'chip active';
      chip.textContent = st+' ('+n+')';
      chip.onclick = function(){
        if(activeState.has(st)){ activeState.delete(st); chip.classList.remove('active'); }
        else { activeState.add(st); chip.classList.add('active'); }
        render();
      };
      stateWrap.appendChild(chip);
    });
    var repos = Array.from(new Set(DATA.map(function(f){return f.repo;}))).sort();
    var repoSel = document.getElementById('repoFilter');
    repos.forEach(function(r){
      var opt = document.createElement('option');
      opt.value = r; opt.textContent = r + ' ('+DATA.filter(function(f){return f.repo===r;}).length+')';
      repoSel.appendChild(opt);
    });
    repoSel.onchange = function(){ activeRepo = repoSel.value; render(); };

    document.getElementById('resetFilters').onclick = function(){
      activeSev = new Set(SEV_ORDER);
      activeState = new Set(STATE_ORDER);
      activeRepo = "";
      repoSel.value = "";
      Array.prototype.forEach.call(sevWrap.querySelectorAll('.chip'), function(c){c.classList.add('active');});
      Array.prototype.forEach.call(stateWrap.querySelectorAll('.chip'), function(c){c.classList.add('active');});
      render();
    };
  }

  // ---------- row rendering ----------
  var openIds = new Set();
  try{
    var saved = JSON.parse(localStorage.getItem('tracker_open_ids')||'[]');
    saved.forEach(function(id){openIds.add(id);});
  }catch(e){}

  function persistOpen(){
    try{ localStorage.setItem('tracker_open_ids', JSON.stringify(Array.from(openIds))); }catch(e){}
  }

  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function rowHtml(f){
    var loc = escapeHtml(f.file) + ':' + f.line;
    if(f.posted_line && f.posted_line !== f.line){
      loc += ' <span class="anchor-note" title="评论在 GitCode 上的实际锚点行号">(评论锚点 L'+f.posted_line+')</span>';
    }
    var isOpen = openIds.has(f.id);
    var alsoHtml = "";
    if(f.also_affects && f.also_affects.length){
      alsoHtml = '<div class="block"><h4>同时影响</h4><ul class="also-affects">' +
        f.also_affects.map(function(a){
          var loc2 = [a.repo, a.file, (a.line?(':'+a.line):"")].filter(Boolean).join(" ");
          return '<li>'+escapeHtml(loc2) + (a.note? ' <span class="note">— '+escapeHtml(a.note)+'</span>':'') + '</li>';
        }).join("") + '</ul></div>';
    }
    var corrHtml = f.has_correction ? '<div class="correction-box">⚠ 有后续更正：'+escapeHtml(f.correction_note)+'</div>' : '';
    var repliesHtml = "";
    if(f.replies && f.replies.length){
      repliesHtml = '<div class="block"><h4>回复（'+f.replies.length+'）</h4>' +
        f.replies.map(function(r){
          return '<p><b>'+escapeHtml(r.author)+'</b> · '+fmtDate(r.at)+'<br>'+escapeHtml(r.body)+'</p>';
        }).join("") + '</div>';
    }

    return ''+
    '<div class="row'+(isOpen?' open':'')+'" data-id="'+f.id+'">'+
      '<div class="row-head">'+
        '<div class="stripe sev-'+f.severity+'"></div>'+
        '<div class="id">'+f.id+'</div>'+
        '<div class="sev-badge sev-'+f.severity+'">'+SEV_LABEL[f.severity]+'</div>'+
        '<div class="title">'+escapeHtml(f.title)+'<span class="loc">'+escapeHtml(f.repo)+' · '+loc+'</span></div>'+
        '<div class="meta-cell"><span class="batch-tag" title="'+escapeHtml(f.batch_label)+'">'+escapeHtml(batchShortLabel(f))+'</span><a class="pr-link" href="'+prUrl(f.repo,f.pr)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+f.repo+' !'+f.pr+'</a>'+(f.has_correction?'<span class="corr-flag">有更正</span>':'')+'</div>'+
        '<div class="meta-cell"><span class="state-pill '+STATE_CLASS[f.state]+'">'+f.state+'</span><span class="days">'+(f.days_open!=null? f.days_open+'天':'')+'</span></div>'+
        '<div class="chevron">▸</div>'+
      '</div>'+
      '<div class="row-body">'+
        '<div class="block"><h4>问题</h4><p>'+escapeHtml(f.detail)+'</p></div>'+
        '<div class="block"><h4>触发场景</h4><p>'+escapeHtml(f.failure_scenario)+'</p></div>'+
        '<div class="block"><h4>建议</h4><p>'+escapeHtml(f.suggestion)+'</p></div>'+
        alsoHtml + corrHtml + repliesHtml +
        '<div class="row-actions">'+
          '<span class="owner-line">责任人：'+escapeHtml(f.owner)+' · 发布于 '+fmtDate(f.posted_at)+'</span>'+
          '<button class="copy-btn" type="button">复制原文</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function sevRank(s){ return SEV_ORDER.indexOf(s); }
  function stateRank(s){ return STATE_ORDER.indexOf(s); }

  function render(){
    var filtered = DATA.filter(function(f){
      if(!activeSev.has(f.severity)) return false;
      if(!activeState.has(f.state)) return false;
      if(activeRepo && f.repo !== activeRepo) return false;
      return true;
    });
    filtered.sort(function(a,b){
      var sr = stateRank(a.state) - stateRank(b.state); // 未响应 first
      if(sr!==0) return sr;
      var vr = sevRank(a.severity) - sevRank(b.severity);
      if(vr!==0) return vr;
      return (b.days_open||0) - (a.days_open||0);
    });
    document.getElementById('listCount').textContent = '('+filtered.length+' / '+DATA.length+')';
    var listEl = document.getElementById('findingsList');
    if(filtered.length===0){
      listEl.innerHTML = '<div class="empty">没有匹配当前筛选条件的意见</div>';
      return;
    }
    listEl.innerHTML = filtered.map(rowHtml).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll('.row'), function(rowEl){
      var id = rowEl.dataset.id;
      rowEl.querySelector('.row-head').addEventListener('click', function(){
        rowEl.classList.toggle('open');
        if(rowEl.classList.contains('open')) openIds.add(id); else openIds.delete(id);
        persistOpen();
      });
      var copyBtn = rowEl.querySelector('.copy-btn');
      if(copyBtn){
        copyBtn.addEventListener('click', function(e){
          e.stopPropagation();
          var f = DATA.find(function(x){return x.id===id;});
          var text = '['+f.severity+'] '+f.title+'\n\n问题：\n'+f.detail+'\n\n触发场景：\n'+f.failure_scenario+'\n\n建议：\n'+f.suggestion;
          try{
            navigator.clipboard.writeText(text);
            var orig = copyBtn.textContent;
            copyBtn.textContent = '已复制';
            setTimeout(function(){copyBtn.textContent = orig;}, 1200);
          }catch(err){}
        });
      }
    });
  }

  // ---------- PR grouping ----------
  function buildPrGrid(){
    var groups = {};
    var order = [];
    DATA.forEach(function(f){
      var key = f.repo+'!'+f.pr;
      if(!groups[key]){ groups[key] = {repo:f.repo, pr:f.pr, batch:f.batch, batch_label:f.batch_label, items:[]}; order.push(key); }
      groups[key].items.push(f);
    });
    order.sort(function(a,b){
      var ga=groups[a], gb=groups[b];
      if(ga.batch_label !== gb.batch_label) return ga.batch_label < gb.batch_label ? -1 : 1;
      return gb.items.length - ga.items.length;
    });
    var grid = document.getElementById('prGrid');
    grid.innerHTML = order.map(function(key){
      var g = groups[key];
      var total = g.items.length;
      var resolved = g.items.filter(function(f){return f.state==="已解决";}).length;
      var replied = g.items.filter(function(f){return f.state==="已回复";}).length;
      var open = total - resolved - replied;
      var segs = [
        {n:resolved, cls:'state-resolved-bar', color:'var(--state-resolved)'},
        {n:replied, cls:'state-replied-bar', color:'var(--state-replied)'},
        {n:open, cls:'state-open-bar', color:'var(--state-open)'}
      ];
      var bar = segs.map(function(s){
        if(s.n===0) return '';
        return '<span style="width:'+(100*s.n/total)+'%;background:'+s.color+'"></span>';
      }).join('');
      var batchShort = g.batch === 'b1' ? '第一批' : (g.batch === 'b2' ? '第二批' : g.batch_label);
      return '<div class="pr-card">'+
        '<div class="pr-head"><a class="pr-name" href="'+prUrl(g.repo,g.pr)+'" target="_blank" rel="noopener">'+g.repo+' !'+g.pr+'</a><span class="pr-batch" title="'+escapeHtml(g.batch_label)+'">'+escapeHtml(batchShort)+'</span></div>'+
        '<div class="state-bar">'+bar+'</div>'+
        '<div class="pr-counts"><span>共 <b>'+total+'</b> 条</span><span>已解决 <b>'+resolved+'</b></span><span>未响应 <b>'+open+'</b></span></div>'+
        '</div>';
    }).join("");
  }

  buildKPI();
  buildFilterChips();
  buildPrGrid();
  render();
})();
</script>
